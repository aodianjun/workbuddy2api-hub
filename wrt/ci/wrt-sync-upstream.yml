name: wrt-sync-upstream

# 让 fork 与上游 ardeyouxipianyi/workbuddy2api-hub 保持同步（等价于网页上的
# "Sync fork" 按钮）：POST /repos/{owner}/{repo}/merge-upstream {"branch":"main"}
#
# 注意：用 GITHUB_TOKEN 推送产生的 commit 不会触发其它 workflow（GitHub 的防递归
# 机制），所以本 workflow 只负责同步；构建/发版在 wrt-packages.yml 里，而那个
# workflow 自己也会先调一次同样的 merge-upstream，不依赖本 workflow 是否跑过。
#
# 已知限制：GitHub 不允许没有 `workflow` 作用域的 token 创建/更新
# .github/workflows/ 下的文件。若上游改了 .github/workflows/* 且 fork 里的版本
# 不同，merge-upstream 会以 HTTP 422 失败（本 workflow 会明确报错）。解决办法：
#   1) 仓库 secret 里加 WRT_SYNC_TOKEN —— 一个带 workflow 作用域的 PAT；
#   2) 在网页上点 "Sync fork"（用账号身份执行，不受 token 作用域限制）。

on:
  schedule:
    - cron: '23 3 * * *'   # 每天 03:23 UTC（北京时间 11:23，避开整点高峰）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrt-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into fork main
    runs-on: ubuntu-latest
    steps:
      - name: Call merge-upstream API (same as the "Sync fork" button)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRT_SYNC_TOKEN: ${{ secrets.WRT_SYNC_TOKEN }}
        run: |
          set -u
          TOKEN="${WRT_SYNC_TOKEN:-$GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream"
          http=$(curl -sS --retry 3 -o /tmp/merge.json -w '%{http_code}' \
            -X POST "$API" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: wrt-sync-upstream" \
            -d '{"branch":"main"}')
          echo "merge-upstream -> HTTP ${http}"
          cat /tmp/merge.json; echo
          msg=$(jq -r '.message // empty' /tmp/merge.json 2>/dev/null || true)
          case "$http" in
            200)
              # 200 = 成功（merge_type: fast-forward / merge / none=已是最新，无需更新）
              echo "::notice::fork sync ok: ${msg}" ;;
            409)
              echo "::error::fork sync conflict (HTTP 409): ${msg}"
              echo "::error::上游改动与 fork 本地改动冲突，无法自动合并。请手动处理："
              echo "::error::  本地 git fetch upstream && git merge upstream/main（解决冲突后 push），"
              echo "::error::  或在 GitHub 网页上用 Sync fork 交互式解决，然后重跑本 workflow。"
              exit 1 ;;
            422)
              echo "::error::fork sync refused (HTTP 422): ${msg}"
              echo "::error::若信息提到 workflow 作用域：上游改动了 .github/workflows/ 下的文件，而当前 token 没有 workflow 作用域。"
              echo "::error::请在仓库 secret 配置带 workflow 作用域的 PAT（WRT_SYNC_TOKEN），或在网页上点 Sync fork。"
              exit 1 ;;
            *)
              echo "::error::merge-upstream failed (HTTP ${http}): ${msg}"
              exit 1 ;;
          esac
